<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>双栈商店 - 修改管理员密码</title>
    <link rel="icon" href="/src/images/logo.png" type="image/png">
    <link rel="stylesheet" href="../login/login.css">
    <link rel="stylesheet" href="./change-password.css">
</head>
<body>
    <main class="login-container">
        <div class="login-box">
            <div class="logo">
                <img src="/src/images/logo.png" alt="双栈商店" class="logo-img">
                <h1>修改管理员密码</h1>
                <p>首次登录必须修改密码后才能使用系统</p>
            </div>
            <form id="changePasswordForm" class="login-form">
                <div class="form-group">
                    <label for="newPassword">修改密码</label>
                    <div class="password-field">
                        <input type="password" id="newPassword" autocomplete="new-password" minlength="8" required aria-describedby="passwordHelp">
                        <button type="button" class="password-toggle" aria-controls="newPassword" aria-label="显示修改密码" aria-pressed="false" title="显示密码">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                                <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z" />
                                <circle cx="12" cy="12" r="3" />
                                <path class="eye-slash" d="m3 3 18 18" />
                            </svg>
                        </button>
                    </div>
                </div>
                <div class="form-group">
                    <label for="confirmPassword">确认密码</label>
                    <div class="password-field">
                        <input type="password" id="confirmPassword" autocomplete="new-password" minlength="8" required>
                        <button type="button" class="password-toggle" aria-controls="confirmPassword" aria-label="显示确认密码" aria-pressed="false" title="显示密码">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                                <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z" />
                                <circle cx="12" cy="12" r="3" />
                                <path class="eye-slash" d="m3 3 18 18" />
                            </svg>
                        </button>
                    </div>
                </div>
                <p id="passwordHelp">新密码至少 8 个字符，不能和旧密码一样，长度上限约为 72 个字母或数字</p>
                <p id="passwordMessage" role="status" aria-live="polite"></p>
                <button type="submit" id="submitPassword" class="login-btn" disabled>重新登录</button>
            </form>
            <button type="button" id="logoutBtn" class="clear-cache-btn">退出登录</button>
        </div>
    </main>
    <script src="/src/components/common/page-common.js"></script>
    <script src="/src/components/common/password-toggle.js"></script>
    <script src="./change-password.js"></script>
</body>
</html>
