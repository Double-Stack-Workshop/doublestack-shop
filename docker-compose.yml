version: '3.8'

name: doublestack-shop

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: doublestack-shop
    ports:
      - "8000:8001"
    volumes:
      - ./backend/data:/app/data
      - ./backend/repos:/app/repos
      - ./backend/scripts:/app/scripts
      - ./backend/backup:/app/backup
      - /var/run/docker.sock:/var/run/docker.sock
      - /:/host:rw
      - /etc/docker:/etc/docker:rw
      - /etc/passwd:/etc/passwd:ro
      - /etc/group:/etc/group:ro
    environment:
      - PYTHONUNBUFFERED=1
    privileged: true
    restart: unless-stopped